<ng-container>
    <mat-card>
        <mat-card-header>
            @if (isAddMode){
            <mat-card-title>
                {{ 'actions.create' | translate }}
            </mat-card-title>
            }@else{
            <mat-card-title>
                {{ 'actions.edit' | translate }}
            </mat-card-title>
            }
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="form">
                <div class="mat-row">
                    <div class="mat-col-12">
                        <mat-form-field class="full-width">
                            <mat-label>Name</mat-label>
                            <input id="user.name" matInput formControlName="name">
                        </mat-form-field>
                    </div>
                </div>
                <div class="mat-row">
                    <div class="mat-col-6">
                        <mat-form-field class="full-width">
                            <mat-label>Username</mat-label>
                            <input id="user.username" matInput formControlName="username">
                        </mat-form-field>
                        <mat-form-field class="full-width">
                            <mat-label>Password</mat-label>
                            <input id="user.password" matInput formControlName="password">
                        </mat-form-field>
                        <mat-card style="margin-bottom: 2em;">
                            <mat-card-content>
                                <p><mat-slide-toggle formControlName="isAdmin">Admin user</mat-slide-toggle></p>
                            </mat-card-content>
                        </mat-card>
                    </div>
                    <div class="mat-col-6">
                        <mat-card>
                            <form [formGroup]="policyForm">
                                <mat-form-field class="full-width">
                                    <mat-label>Policy</mat-label>
                                    <mat-select formControlName="policy" [compareWith]="compareFn"
                                        (selectionChange)="onAddPolicy()">
                                        <mat-option *ngFor="let c of getPolicies();" [value]="c">
                                            {{c.name}}
                                        </mat-option>
                                    </mat-select>
                                </mat-form-field>
                                <mat-card-content>
                                    <mat-chip-listbox>
                                        <mat-chip-row *ngFor="let p of form.value.policies"
                                            (removed)="onRemovePolicy(p.id)">
                                            {{p.name}}
                                            <button matChipRemove>
                                                <mat-icon>cancel</mat-icon>
                                            </button>
                                        </mat-chip-row>
                                    </mat-chip-listbox>
                                </mat-card-content>
                            </form>
                        </mat-card>
                    </div>
                </div>
            </form>
        </mat-card-content>
        <mat-card-actions align="end">
            <button id="save-btn" type="button" (click)="onSubmit()" mat-raised-button color="primary">
                <mat-icon>save</mat-icon> {{ 'actions.save' | translate }}
            </button>
            <button mat-mini-fab color="primary" [routerLink]="['/user']">
                <mat-icon>keyboard_return</mat-icon>
            </button>
        </mat-card-actions>
    </mat-card>
</ng-container>
