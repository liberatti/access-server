<ng-container>
    <mat-card>
        <mat-card-header>
            <mat-card-title>
                {{ 'titles.policies' | translate }}
            </mat-card-title>
            <mat-card-actions>
                <button id="add-btn" mat-button color="primary" [routerLink]="['add']">
                    <mat-icon>add</mat-icon> {{'actions.create'|translate}}
                </button>
            </mat-card-actions>
        </mat-card-header>
        <mat-card-content>
            <table mat-table [dataSource]="policyDS" matSort>
                <tr mat-header-row *matHeaderRowDef="policyDC"></tr>
                <tr mat-row *matRowDef="let row; columns: policyDC;"></tr>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef> {{ 'attr.name' | translate }} </th>
                    <td mat-cell *matCellDef="let element">
                        {{element.name}}
                    </td>
                </ng-container>
                <ng-container matColumnDef="networks">
                    <th mat-header-cell *matHeaderCellDef> {{ 'attr.networks' | translate }} </th>
                    <td mat-cell *matCellDef="let element">
                        <mat-chip-listbox *ngIf="element.networks">
                            <mat-chip-row *ngFor='let r of element.networks;'>
                                {{r}}
                            </mat-chip-row>
                        </mat-chip-listbox>
                    </td>
                </ng-container>
                <ng-container matColumnDef="total_targets">
                    <th mat-header-cell *matHeaderCellDef> {{ 'attr.totalClients' | translate }} </th>
                    <td mat-cell *matCellDef="let element">
                        {{element.clients ? element.clients.length : 0}}
                    </td>
                </ng-container>
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef class="mat-column-action"> {{ 'attr.action' | translate }} </th>
                    <td mat-cell *matCellDef="let element;let i = index;" class="mat-column-action">
                        <div style="border:none" class="toggle-container">
                            <button mat-button [matMenuTriggerFor]="menu">
                                <mat-icon>more_vert</mat-icon>
                            </button>
                            <mat-menu #menu="matMenu" xPosition="before">
                                <button mat-menu-item [routerLink]="['edit',element.id]">
                                    <mat-icon>edit</mat-icon> {{ 'actions.edit' | translate }}
                                </button>
                                <button mat-menu-item (click)="onRemove(element)">
                                    <mat-icon>delete</mat-icon> {{ 'actions.delete' | translate }}
                                </button>
                            </mat-menu>
                        </div>
                    </td>
                </ng-container>
            </table>
            <mat-paginator [pageSizeOptions]="[5, 10, 20]" [length]="policyPA.total_elements"
                [pageSize]="policyPA.per_page" [pageIndex]="policyPA.page - 1" (page)="nextPage($event)"
                showFirstLastButtons>
            </mat-paginator>
        </mat-card-content>
    </mat-card>
</ng-container>
