<ng-container>
  <mat-card class="glass-card">
    <mat-card-header>
      <mat-card-title>
        {{ 'titles.serverSettings' | translate }}
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form">
        <div class="mat-row">
          <div class="mat-col-12">
            <mat-form-field class="full-width" appearance="outline">
              <mat-label>{{ 'attr.serverName' | translate }}</mat-label>
              <input id="server.name" matInput formControlName="name" [placeholder]="'hints.serverName' | translate">
              <mat-icon matSuffix>dns</mat-icon>
            </mat-form-field>
          </div>
        </div>

        <div class="mat-row">
          <div class="mat-col-6">
            <mat-form-field class="full-width" appearance="outline">
              <mat-label>{{ 'attr.vpnNetwork' | translate }}</mat-label>
              <input id="server.network" matInput formControlName="network"
                [placeholder]="'hints.vpnNetwork' | translate">
              <mat-icon matSuffix>router</mat-icon>
            </mat-form-field>
          </div>
          <div class="mat-col-6">
            <mat-form-field class="full-width" appearance="outline">
              <mat-label>{{ 'attr.netmask' | translate }}</mat-label>
              <input id="server.netmask" matInput formControlName="netmask" [placeholder]="'hints.netmask' | translate">
              <mat-icon matSuffix>grid_view</mat-icon>
            </mat-form-field>
          </div>
        </div>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <button type="button" mat-button [routerLink]="['/user']">
        {{ 'actions.cancel' | translate }}
      </button>
      <button id="save-btn" type="button" (click)="onSubmit()" mat-raised-button color="primary">
        <mat-icon>save</mat-icon> {{ 'actions.save' | translate }}
      </button>
    </mat-card-actions>
  </mat-card>
</ng-container>
