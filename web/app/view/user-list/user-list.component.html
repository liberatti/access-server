<ng-container>
    <mat-card>
        <mat-card-header>
            <mat-card-title>
                {{ 'titles.users' | translate }}
            </mat-card-title>
            <mat-card-actions>
                <button id="add-btn" mat-button color="primary" [routerLink]="['add']">
                    <mat-icon>add</mat-icon> {{ 'actions.create' | translate }}
                </button>
            </mat-card-actions>
        </mat-card-header>
        <mat-card-content>
            <table mat-table [dataSource]="userDS">
                <tr mat-header-row *matHeaderRowDef="userDC"></tr>
                <tr mat-row *matRowDef="let row; columns: userDC;"></tr>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef> {{ 'attr.name' | translate }} </th>
                    <td mat-cell *matCellDef="let element" class="full-width">
                        {{element.name}}
                    </td>
                </ng-container>

                <ng-container matColumnDef="sessions">
                    <th mat-header-cell *matHeaderCellDef class="no-wrap"> {{ 'attr.activeSession' | translate }} </th>
                    <td mat-cell *matCellDef="let element">
                        <mat-chip-set>
                            @for (n of element.sessions; track n) {
                            <mat-chip>{{n.remote_ip}}->{{n.local_ip}}</mat-chip>
                            }
                        </mat-chip-set>
                    </td>
                </ng-container>
                <ng-container matColumnDef="role">
                    <th mat-header-cell *matHeaderCellDef> {{ 'attr.role' | translate }} </th>
                    <td mat-cell *matCellDef="let element"> {{element.role}} </td>
                </ng-container>
                <ng-container matColumnDef="download">
                    <th mat-header-cell *matHeaderCellDef> </th>
                    <td mat-cell *matCellDef="let element;let i = index;" class="mat-column-action">
                    </td>
                </ng-container>
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef class="mat-column-action"> {{ 'attr.action' | translate }} </th>
                    <td mat-cell *matCellDef="let element;let i = index;" class="mat-column-action">
                        <div class="button-group">
                            <button mat-button [matMenuTriggerFor]="menu1">
                                <mat-icon>more_vert</mat-icon>
                            </button>
                            <mat-menu #menu1="matMenu" xPosition="before">
                                <button mat-menu-item [routerLink]="['edit',element.id]">
                                    <mat-icon>edit</mat-icon> {{ 'actions.edit' | translate }}
                                </button>
                                <button mat-menu-item (click)="onRemove(element)">
                                    <mat-icon>delete</mat-icon> {{ 'actions.delete' | translate }}
                                </button>
                            </mat-menu>
                            <button mat-button [matMenuTriggerFor]="menu2">
                                <mat-icon>download</mat-icon>
                            </button>
                            <mat-menu #menu2="matMenu" xPosition="before">
                                <button mat-menu-item (click)="donwloadConfig(element.id,'default')">
                                    <mat-icon>download</mat-icon> {{ 'actions.computer' | translate }}
                                </button>
                                <button mat-menu-item (click)="donwloadConfig(element.id,'mobile')">
                                    <mat-icon>download</mat-icon> {{ 'actions.mobile' | translate }}
                                </button>
                            </mat-menu>
                        </div>
                    </td>
                </ng-container>
            </table>
            <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                [length]="userPA.total_elements"
                [pageSize]="userPA.per_page"
                [pageIndex]="userPA.page - 1"
                (page)="nextPage($event)"
                showFirstLastButtons>
            </mat-paginator>
        </mat-card-content>
    </mat-card>
</ng-container>
