<div id="auth-layout" class="login-background">
  <form [formGroup]="form" id="login-form" class="animate-in">
    <div class="login-brand">
      <div class="brand-logo-container">
        <mat-icon class="brand-icon">vpn_key</mat-icon>
      </div>
      <h1 class="brand-name">Access Server</h1>
      <p class="brand-subtitle">Initial Configuration</p>
    </div>

    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Initializing System</mat-card-title>
        <mat-card-subtitle>Please wait while the server initializes configuration details...</mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-content>
        <div class="loading-box" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 0;">
          <div class="spinner"></div>
          <p class="loading-text" style="color: var(--text-secondary); margin-top: 24px; font-size: 14px; text-align: center;">
            Initializing the tool. Generating PKI certificates, credentials, and setting up system parameters...
          </p>
        </div>
      </mat-card-content>
    </mat-card>
  </form>
</div>
