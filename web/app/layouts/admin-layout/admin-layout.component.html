<div class="admin-container">
  <mat-toolbar class="admin-header">
    <span class="brand-text">
      <img src="assets/icon.png" class="brand-logo" alt="Access Server Logo">
      <small>{{version}}</small>
    </span>

    <div class="nav-links">
      <a mat-button routerLink="/user" routerLinkActive="active">
        <mat-icon>domain</mat-icon>
        <span>{{ 'nav.users' | translate }}</span>
      </a>
      <a mat-button routerLink="/policy" routerLinkActive="active">
        <mat-icon>security</mat-icon>
        <span>{{ 'nav.policies' | translate }}</span>
      </a>
      <a mat-button routerLink="/dmz" routerLinkActive="active">
        <mat-icon>webhook</mat-icon>
        <span>{{ 'nav.dmzServices' | translate }}</span>
      </a>
      <a mat-button routerLink="/system" routerLinkActive="active">
        <mat-icon>settings</mat-icon>
        <span>{{ 'nav.settings' | translate }}</span>
      </a>
      <button mat-button (click)="showAbout()">
        <mat-icon>info</mat-icon>
        <span>{{ 'actions.about' | translate }}</span>
      </button>
    </div>

    <span class="spacer"></span>

    <span class="user-greeting">{{user.username}}</span>

    <button mat-button (click)="logout()" class="logout-btn">
      <mat-icon>logout</mat-icon> {{ 'actions.logout' | translate }}
    </button>
  </mat-toolbar>

  <div class="admin-content">
    <div class="page-container animate-in">
      <router-outlet></router-outlet>
    </div>
    <footer class="admin-footer">
      <span>&copy; 2026 Access Server · Advanced Access Control Panel</span>
      <div class="spacer"></div>
      <span class="footer-tag">Open Source</span>
    </footer>
  </div>
</div>
